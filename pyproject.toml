[project]
name = "dso576-cleaning-andy"
version = "0.1.0"
description = "Module 6 ListenBrainz data cleaning (Andy Chen)"
requires-python = ">=3.12,<3.13"
dependencies = [
    "pandas==2.2.3",
    "numpy==2.5.3",
    "streamlit==1.66.1",
    "plotly==6.9.0",
]

[dependency-groups]
dev = [
    "pytest==9.1.1",
]
notebooks = [
    "ipykernel>=6,<8",
    "nbconvert>=7,<8",
    "tabulate>=0.9,<1",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
